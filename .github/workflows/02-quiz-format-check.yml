name: Check Quiz Format

on:
  pull_request:
    branches:
      - main

jobs:
  check_format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run format check
        run: |
          uv run python scripts/quiz_format_checker.py python_quiz/quiz/_python
