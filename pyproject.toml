[project]
name = "python-quiz"
version = "0.1.1"
description = "cli library for studying python"
authors = [
    { name = "jungminchae", email = "minchae3618@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["python-quiz", "Python", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/jungminchae/python-quiz"
Repository = "https://github.com/jungminchae/python-quiz"

[project.scripts]
pq = "python_quiz.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 140
